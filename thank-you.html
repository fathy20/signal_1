<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>شكراً لتواصلك - Antwave</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17929209756"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'AW-17929209756');
    </script>

    <!-- Google Fonts - Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #003B73;
            --primary-orange: #FFA500;
            --white: #FFFFFF;
            --light-bg: #F0F4F8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #002855 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        .thank-you-container {
            background: var(--white);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-orange) 0%, #FFB732 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 165, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 165, 0, 0);
            }
        }

        .icon-wrapper svg {
            width: 50px;
            height: 50px;
            stroke: var(--white);
            stroke-width: 2;
            fill: none;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .redirect-text {
            color: #888;
            font-size: 0.95rem;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--light-bg);
            border-top-color: var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .product-name {
            background: var(--light-bg);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="thank-you-container">
        <img src="assets/logo.png" alt="Antwave Logo" class="logo">
        
        <div class="icon-wrapper">
            <svg id="type-icon" viewBox="0 0 24 24">
                <!-- Default: WhatsApp icon -->
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>

        <h1 id="title">شكراً لتواصلك!</h1>
        
        <div id="product-container" class="product-name" style="display: none;">
            <span id="product-name"></span>
        </div>

        <p id="message">جاري تحويلك الآن...</p>
        
        <p class="redirect-text">
            <span class="loader"></span>
            <span id="redirect-text">سيتم تحويلك خلال ثانيتين</span>
        </p>
    </div>

    <script>
        // Parse URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                type: params.get('type') || 'whatsapp',
                dest: params.get('dest') || 'https://wa.me/201125655647',
                product: params.get('product') || ''
            };
        }

        // Update page content based on type
        function updatePageContent(params) {
            const typeIcon = document.getElementById('type-icon');
            const title = document.getElementById('title');
            const message = document.getElementById('message');
            const productContainer = document.getElementById('product-container');
            const productName = document.getElementById('product-name');

            if (params.type === 'phone') {
                // Phone icon
                typeIcon.innerHTML = '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>';
                title.textContent = 'شكراً لاتصالك!';
                message.textContent = 'جاري تحويلك للاتصال الآن...';
            } else {
                // WhatsApp icon (default)
                typeIcon.innerHTML = '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>';
                title.textContent = 'شكراً لتواصلك!';
                message.textContent = 'جاري تحويلك إلى واتساب الآن...';
            }

            // Show product name if available
            if (params.product) {
                productContainer.style.display = 'inline-block';
                productName.textContent = params.product;
            }
        }

        // Fire Google Ads conversion
        function fireConversion(params) {
            const conversionLabel = params.type === 'phone' ? 'phone_conversion' : 'whatsapp_conversion';
            
            gtag('event', 'conversion', {
                'send_to': 'AW-17929209756/' + conversionLabel,
                'event_callback': function() {
                    console.log('Conversion tracked successfully');
                }
            });

            // Also fire a custom event for analytics
            gtag('event', params.type + '_thank_you_page', {
                'event_category': 'conversion',
                'event_label': params.product || 'general',
                'value': 1
            });
        }

        // Redirect to destination
        function redirectToDestination(dest) {
            setTimeout(function() {
                window.location.href = dest;
            }, 1500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const params = getUrlParams();
            
            // Update page content
            updatePageContent(params);
            
            // Fire conversion
            fireConversion(params);
            
            // Redirect after delay
            redirectToDestination(params.dest);
        });
    </script>
</body>

</html>
