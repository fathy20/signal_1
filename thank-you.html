    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #003B73 0%, #001F3F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 500px;
        }

        .logo {
            height: 60px;
            margin-bottom: 30px;
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,165,0,0.5); }
            70% { box-shadow: 0 0 0 20px rgba(255,165,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,165,0,0); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: #FFA500;
            border-radius: 3px;
            animation: fill 2s linear forwards;
        }

        @keyframes fill {
            from { width: 0%; }
            to { width: 100%; }
        }

        .redirect-text {
            font-size: 14px;
            opacity: 0.7;
        }

        .manual-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #FFA500;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
        }

<body>
    <div class="container">
        <img src="assets/logo.png" alt="Antwave" class="logo">

        <div class="icon-wrapper" id="icon-wrapper">📞</div>

        <h1 id="page-title">شكراً لتواصلك!</h1>
        <p id="page-msg">جاري تحويلك الآن...<br>شكراً لثقتك في Antwave</p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p class="redirect-text">سيتم التحويل تلقائياً خلال ثانيتين</p>

        <a href="#" id="manual-link" class="manual-link">انتقل الآن</a>
    </div>

    <script>
        // Fire Google Ads Conversion
        function fireConversion(type) {
            if (typeof gtag === 'function') {
                if (type === 'whatsapp') {
                    gtag('event', 'conversion', {
                        'send_to': 'AW-17929209756/whatsapp_click',
                        'event_category': 'Contact',
                        'event_label': 'WhatsApp Click'
                    });
                    gtag('event', 'whatsapp_click', {
                        'event_category': 'Contact',
                        'event_label': 'WhatsApp Button'
                    });
                } else if (type === 'phone') {
                    gtag('event', 'conversion', {
                        'send_to': 'AW-17929209756/phone_click',
                        'event_category': 'Contact',
                        'event_label': 'Phone Click'
                    });
                    gtag('event', 'phone_click', {
                        'event_category': 'Contact',
                        'event_label': 'Phone Button'
                    });
                }
            }

            // TikTok Pixel
            if (typeof ttq === 'object' && ttq.track) {
                ttq.track('Contact', { content_type: type });
            }
        }

        // Read redirect param
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const product = params.get('product') || '';

            let redirectUrl = 'https://wa.me/201125655647';

            if (type === 'whatsapp') {
                document.getElementById('icon-wrapper').textContent = '💬';
                document.getElementById('page-title').textContent = 'جاري تحويلك للواتساب!';
                document.getElementById('page-msg').textContent = 'شكراً لثقتك في Antwave\nسيتم فتح واتساب تلقائياً';
                const msg = product ? 'أريد الاستفسار عن ' + product : 'أريد الاستفسار عن خدماتكم';
                redirectUrl = 'https://wa.me/201125655647?text=' + encodeURIComponent(msg);
                document.getElementById('manual-link').href = redirectUrl;
                document.getElementById('manual-link').textContent = 'فتح واتساب الآن';
            } else if (type === 'phone') {
                document.getElementById('icon-wrapper').textContent = '📞';
                document.getElementById('page-title').textContent = 'جاري الاتصال بك!';
                document.getElementById('page-msg').textContent = 'شكراً لثقتك في Antwave\nسيتم الاتصال تلقائياً';
                redirectUrl = 'tel:01125655647';
                document.getElementById('manual-link').href = redirectUrl;
                document.getElementById('manual-link').textContent = 'اتصل الآن';
            }

            // Fire conversion event
            fireConversion(type);

            // Redirect after 2 seconds
            setTimeout(function() {
                window.location.href = redirectUrl;
            }, 2000);
        };
    </script>
</body>
